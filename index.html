<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIVE Office Secret Santa</title>
<style>
:root{--bg:#fbf7f2;--card:#fff;--ink:#2a1a1a;--mute:#7a6a6a;--red:#c41f26;--red2:#a3161c;--gold:#b8892e;--line:#ead9d2;--chip:#f6e9e4}
@media(prefers-color-scheme:dark){:root{--bg:#1c1213;--card:#2a1b1c;--ink:#f6ece8;--mute:#b9a5a1;--red:#e24a50;--red2:#c93a40;--gold:#d9a94a;--line:#4a3235;--chip:#3a2527}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--red);color:#fff;text-align:center;padding:calc(26px + env(safe-area-inset-top,0px)) 16px 22px;border-bottom:6px double var(--gold)}
header h1{margin:0;font:700 2rem Georgia,serif}header p{margin:6px 0 0;opacity:.92}
main{max-width:920px;margin:0 auto;padding:18px 14px 60px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.bar input{flex:1;min-width:180px;width:auto}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--red);background:var(--red);color:#fff;padding:9px 16px;font-weight:600}
button.ghost{background:transparent;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:400;text-align:left;padding:16px;border-radius:12px;width:100%}
.card h3{margin:0 0 4px;font:700 1.2rem Georgia,serif;color:var(--red)}.card small{color:var(--mute)}
.badge{display:inline-block;background:var(--chip);border-radius:99px;padding:2px 10px;font-size:.8rem;margin-top:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel h2{margin:0;font:700 1.7rem Georgia,serif;color:var(--red)}
h4{margin:22px 0 8px;color:var(--red);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;border-bottom:1px solid var(--line);padding-bottom:4px}
dl{margin:0;display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px}dt{color:var(--mute)}dd{margin:0;word-break:break-word}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.form label{font-size:.85rem;color:var(--mute)}.full{grid-column:1/-1}
.prefs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.pref{display:flex;justify-content:space-between;background:var(--chip);border:1px solid var(--line);color:var(--ink);font-weight:400}
.pref.y{border-color:#2e8b57}.pref.n{border-color:var(--red)}.yes{color:#2e8b57}.no{color:var(--red)}
.wish{display:inline-block;margin-top:8px;background:var(--gold);color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.empty,.note{color:var(--mute);padding:24px 10px;text-align:center}.note{background:var(--chip);border-radius:10px;padding:10px 14px;text-align:left;margin:0 0 14px}
@media(max-width:560px){.form{grid-template-columns:1fr}dl{grid-template-columns:1fr}}
</style></head><body>
<header><h1>🎅 FIVE Office Secret Santa</h1><p>22 December · 10 AM · Meeting Room · $25 budget</p></header>
<main id="app"><div class="empty">Loading…</div></main>
<script>
// === PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES ===
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbw6L9TOjxTcAHpJb7pyw5se4wv6VLGoSpz5-PMLjk-hRjxy0sWym94RhGOBDFGc2q2Y/exec";
const FAV=["Color","Food","Candy or snacks","Drinks","Scents","Animals","Places to shop","Restaurants","Hobbies or interests","Brands","Music / artists","Sports teams","Travel destinations","TV shows or movies","Books or authors","Wild card (anything)"];
const PREF=["Coffee","Tea","Movie tickets","Books","Home decor","Candles","Bath products","Sweets","Savories","Baked goods","Indoor activities","Outdoor activities","Alcohol","Clothing","Jewelry","Plants"];
const app=document.getElementById("app");
let profiles=[],view={mode:"list"},q="",d=null,state="loading";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>{u=String(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:""}catch{return""}};
async function load(){
  if(!SCRIPT_URL){state="nourl";return render()}
  try{const r=await fetch(SCRIPT_URL,{cache:"no-store"});profiles=(await r.json()).sort((a,b)=>a.name.localeCompare(b.name));state="ok"}catch(e){state="err"}
  render();
}
function render(){
  if(state==="loading")return app.innerHTML='<div class="empty">Loading…</div>';
  if(state==="nourl")return app.innerHTML='<div class="empty">Setup needed: add your Apps Script URL at the top of the script in index.html.</div>';
  if(state==="err")return app.innerHTML='<div class="empty">Couldn’t load profiles. Try refreshing.</div>';
  if(view.mode==="edit")return edit();if(view.mode==="detail")return detail();list();
}
function list(){
  const l=profiles.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
  app.innerHTML=`<div class="bar"><input id="s" type="search" placeholder="Search by name…" value="${esc(q)}"><button id="new">Add my profile</button></div>
  ${l.length?`<div class="grid">${l.map(p=>`<button class="card" data-n="${esc(p.name)}"><h3>${esc(p.name)}</h3><small>${esc((p.favs&&(p.favs["Hobbies or interests"]||p.favs["Food"]))||"Tap to see favorites")}</small><div>${p.wishLink?'<span class="badge">🎁 Wish list</span>':""}</div></button>`).join("")}</div>`:`<div class="empty">${profiles.length?"No matches.":"No profiles yet. Be the first!"}</div>`}`;
  const s=document.getElementById("s");s.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;list();const n=document.getElementById("s");n.focus();n.setSelectionRange(p,p)};
  document.getElementById("new").onclick=()=>start({});
  app.querySelectorAll(".card").forEach(c=>c.onclick=()=>{view={mode:"detail",n:c.dataset.n};render();scrollTo(0,0)});
}
function detail(){
  const p=profiles.find(x=>x.name===view.n);if(!p){view={mode:"list"};return render()}
  const f=p.favs||{},pr=p.prefs||{},fv=FAV.filter(k=>f[k]),lk=PREF.filter(k=>pr[k]==="y"),no=PREF.filter(k=>pr[k]==="n"),w=(p.wishes||[]).filter(Boolean),u=safeUrl(p.wishLink);
  app.innerHTML=`<div class="bar"><button class="ghost" id="back">← Everyone</button></div><div class="panel"><h2>${esc(p.name)}</h2>
  ${u?`<a class="wish" href="${esc(u)}" target="_blank" rel="noopener noreferrer">🎁 View wish list</a>`:""}
  ${fv.length?`<h4>Favorite things</h4><dl>${fv.map(k=>`<dt>${esc(k)}</dt><dd>${esc(f[k])}</dd>`).join("")}</dl>`:""}
  ${lk.length||no.length?`<h4>Preferences</h4>${lk.length?`<p class="yes">👍 ${lk.map(esc).join(", ")}</p>`:""}${no.length?`<p class="no">👎 ${no.map(esc).join(", ")}</p>`:""}`:""}
  ${w.length?`<h4>Wish ideas</h4><ol>${w.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
  ${p.allergies||p.sizes||p.avoid?`<h4>Practicalities</h4><dl>${p.allergies?`<dt>Allergies</dt><dd>${esc(p.allergies)}</dd>`:""}${p.sizes?`<dt>Sizes</dt><dd>${esc(p.sizes)}</dd>`:""}${p.avoid?`<dt>Don’t want / need</dt><dd>${esc(p.avoid)}</dd>`:""}</dl>`:""}
  <div class="row"><button id="ed">Edit this profile</button></div></div>`;
  document.getElementById("back").onclick=()=>{view={mode:"list"};render()};
  document.getElementById("ed").onclick=()=>start(p);
}
function start(p){d={name:p.name||"",pin:"",locked:!!p.name,favs:{...(p.favs||{})},prefs:{...(p.prefs||{})},allergies:p.allergies||"",sizes:p.sizes||"",avoid:p.avoid||"",wishLink:p.wishLink||"",wishes:[...(p.wishes||[]),"","",""].slice(0,3)};view={mode:"edit"};render();scrollTo(0,0)}
function edit(){
  app.innerHTML=`<div class="bar"><button class="ghost" id="cancel">← Cancel</button></div><div class="panel"><h2>${d.locked?"Edit profile":"My profile"}</h2>
  <p class="note">This page is visible to everyone, so skip anything private. Pick a PIN (3+ characters) so only you can change your profile later. Tap a preference to cycle: blank → 👍 → 👎.</p>
  <div class="form"><div><label>Name</label><input data-k="name" maxlength="60" value="${esc(d.name)}" ${d.locked?"readonly":""}></div>
  <div><label>PIN ${d.locked?"(enter yours to save)":"(make one up)"}</label><input data-k="pin" type="password" maxlength="20" autocomplete="off"></div>
  <div class="full"><label>Wish list link (Amazon, Etsy, etc.)</label><input data-k="wishLink" type="url" placeholder="https://…" value="${esc(d.wishLink)}"></div></div>
  <h4>Favorite things</h4><div class="form">${FAV.map(k=>`<div><label>${esc(k)}</label><input data-f="${esc(k)}" maxlength="120" value="${esc(d.favs[k]||"")}"></div>`).join("")}</div>
  <h4>Preferences</h4><div class="prefs">${PREF.map(k=>{const v=d.prefs[k]||"";return`<button type="button" class="pref ${v}" data-p="${esc(k)}">${esc(k)}<b>${v==="y"?"👍":v==="n"?"👎":"–"}</b></button>`}).join("")}</div>
  <h4>Practicalities</h4><div class="form"><div class="full"><label>Allergies or sensitivities</label><input data-k="allergies" maxlength="160" value="${esc(d.allergies)}"></div><div class="full"><label>Clothing and shoe sizes</label><input data-k="sizes" maxlength="120" value="${esc(d.sizes)}"></div><div class="full"><label>Don’t want / need</label><input data-k="avoid" maxlength="160" value="${esc(d.avoid)}"></div></div>
  <h4>Wish ideas</h4><div class="form">${d.wishes.map((w,i)=>`<div class="full"><label>${i+1}.</label><input data-w="${i}" maxlength="120" value="${esc(w)}"></div>`).join("")}</div>
  <div class="row"><button id="save">Save profile</button>${d.locked?'<button class="ghost" id="del">Delete profile</button>':""}</div><p id="msg" class="note" hidden></p></div>`;
  app.querySelectorAll("[data-k]").forEach(i=>i.oninput=()=>d[i.dataset.k]=i.value);
  app.querySelectorAll("[data-f]").forEach(i=>i.oninput=()=>d.favs[i.dataset.f]=i.value);
  app.querySelectorAll("[data-w]").forEach(i=>i.oninput=()=>d.wishes[+i.dataset.w]=i.value);
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const k=b.dataset.p,c=d.prefs[k]||"",n=c===""?"y":c==="y"?"n":"";if(n)d.prefs[k]=n;else delete d.prefs[k];b.className="pref "+n;b.querySelector("b").textContent=n==="y"?"👍":n==="n"?"👎":"–"});
  document.getElementById("cancel").onclick=()=>{view={mode:"list"};render()};
  document.getElementById("save").onclick=()=>send("save");
  const del=document.getElementById("del");if(del)del.onclick=()=>confirm("Delete this profile?")&&send("delete");
}
async function send(action){
  const m=document.getElementById("msg"),say=t=>{m.textContent=t;m.hidden=false};
  if(!d.name.trim())return say("Please add your name.");if(d.pin.length<3)return say("Please enter a PIN (3+ characters).");
  const link=d.wishLink.trim()?safeUrl(d.wishLink):"";if(d.wishLink.trim()&&!link)return say("That wish list link doesn’t look valid.");
  const favs={};FAV.forEach(k=>{const v=(d.favs[k]||"").trim();if(v)favs[k]=v});
  const profile={favs,prefs:d.prefs,allergies:d.allergies.trim(),sizes:d.sizes.trim(),avoid:d.avoid.trim(),wishLink:link,wishes:d.wishes.map(w=>w.trim()).filter(Boolean)};
  say("Saving…");
  try{
    const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,name:d.name.trim(),pin:d.pin,profile})});
    const j=await r.json();if(j.error)return say(j.error);
    await load();view=action==="save"?{mode:"detail",n:d.name.trim()}:{mode:"list"};render();scrollTo(0,0);
  }catch(e){say("Couldn’t save. Check your connection and try again.")}
}
load();
</script></body></html>
